# Deploys the three static files to S3 and clears the CloudFront cache.
#
# ---------------------------------------------------------------------------
# DEVOPS: this needs four repository variables before it will run.
# Repository settings -> Repository variables
#
#   AWS_ACCESS_KEY_ID          (mark as Secured)
#   AWS_SECRET_ACCESS_KEY      (mark as Secured)
#   S3_BUCKET                  bucket serving football.getcashi.com
#   CLOUDFRONT_DISTRIBUTION_ID distribution in front of that bucket
#
# Optional:
#   S3_PREFIX                  path inside the bucket, if the site isn't at
#                              the root. Leave unset for root.
#   AWS_DEFAULT_REGION         defaults to eu-west-2 below, change if wrong.
#
# The IAM user needs only:
#   s3:PutObject, s3:DeleteObject, s3:ListBucket on that bucket
#   cloudfront:CreateInvalidation on that distribution
#
# There is no build step. Three HTML files, no dependencies, nothing to
# compile. If you'd rather deploy by hand, the files are just index.html,
# admin.html and results.html.
# ---------------------------------------------------------------------------

image: atlassian/default-image:4

definitions:
  steps:
    - step: &deploy
        name: Deploy to S3 and invalidate CloudFront
        deployment: production
        script:
          - export AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-2}
          - PREFIX=${S3_PREFIX:-}
          - pipe: atlassian/aws-s3-deploy:1.6.1
            variables:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              S3_BUCKET: '$S3_BUCKET$PREFIX'
              LOCAL_PATH: '.'
              EXTRA_ARGS: >-
                --exclude '*'
                --include 'index.html'
                --include 'admin.html'
                --include 'results.html'
                --cache-control 'public, max-age=300'
                --content-type 'text/html; charset=utf-8'
          - pipe: atlassian/aws-cloudfront-invalidate:0.11.0
            variables:
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              DISTRIBUTION_ID: $CLOUDFRONT_DISTRIBUTION_ID
              PATHS: '/*'

pipelines:
  branches:
    main:
      - step: *deploy
    master:
      - step: *deploy
